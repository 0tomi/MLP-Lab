[theme]
base = "light"
primaryColor = "#3F6E9A"
backgroundColor = "#FAF8F4"
secondaryBackgroundColor = "#F1EDE5"
textColor = "#26293B"
borderColor = "#E3DDD1"
linkColor = "#3F6E9A"
baseRadius = "10px"
font = "Figtree:https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap, serif"
codeFont = "monospace"
chartCategoricalColors = ["#3F6E9A", "#D9825B", "#5E9E7E", "#9C7BB5", "#C9A646"]

[theme.sidebar]
backgroundColor = "#F1EDE5"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
